  - {id: S002, area: A1, type: form, name: "Login form (email, password)", location: "/ #login", source: both, personas: [P1, P2, P3], reach: "login page", leads_to: null, note: "on success goes to /dashboard.html"}
  - {id: S003, area: A1, type: notification, name: "Login error message", location: "/ #msg", source: both, personas: [P1, P2, P3], reach: "login page > submit wrong details", leads_to: null, note: "seen: 'Wrong email or password.'"}
