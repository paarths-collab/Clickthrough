# User-flow registry. Single source of truth for what a user can do with this
# product and whether it has been shown to work. Check it with:
#   python3 .userflow/bin/uf-check.py
version: 1

product:
  name: "Tasklet"
  # one paragraph: what the product is for, in plain words
  purpose: >-
    Tasklet is a small task tracker for small teams. A person signs up with
    name, email and password and lands on their dashboard already logged in.
    They create projects, add tasks to them (from the project page or the
    dashboard quick-add box), tick tasks done (and they stay done), delete
    tasks, see every task across their projects on My Tasks, invite teammates
    by email from a Team page in the sidebar, change their display name in
    Settings, log out and back in, and reset a forgotten password by email
    from the login page. Nobody else can see a person's projects or tasks.
  intent_sources: ["PRD.md", "README.md"]

# How to run the real product. Filled in by uf-preflight.
run:
  install: "npm install"   # product has no runtime dependencies; installs the test-only devDependency @playwright/test
  boot: "npm start"        # one command that starts the whole stack (static pages + API + SQLite in one node process)
  seed: "npm run seed"
  reset: "npm run reset"   # same script as seed: wipes every table (sessions too) and reloads demo data; works while the server is up
  stop: "kill the `node server.js` process (no stop script exists)"
  base_url: "http://localhost:4173"
  test_command: "npx playwright test -c userflow-tests/playwright.config.js"   # Playwright + installed Chrome; product must be running; each test resets the data; set UF_EVIDENCE_DIR to keep screenshots
  services:
    - {name: web+api, check: "GET / returns 200 login page; entry page loads in Chrome via Playwright", logs: "stdout of npm start (captured in <run>/raw/server.log); requests are not logged"}
    - {name: database, check: "sqlite3 -readonly tasklet.db 'select count(*) from users' = 3 after seed", logs: "none"}
  stubs: []              # third-party services stubbed at the network edge, if any

# Kinds of user. `auth` says how to become them (seeded account, sign-up, token).
personas:
  - {id: P1, name: "Owner", goal: "Run projects and tasks for a small team, invite teammates", auth: "alice@example.com / password123 (seeded: 2 projects, 4 tasks)"}
  - {id: P2, name: "New user", goal: "Sign up and get started from nothing", auth: "sign up at /signup.html with a fresh email; or carol@example.com / password123 (seeded, no projects or tasks)"}
  - {id: P3, name: "Another account holder", goal: "Use their own account; must never see someone else's projects or tasks", auth: "bob@example.com / password123 (seeded: 1 project, 1 task)"}
#  - {id: P1, name: "Owner", goal: "Run projects for a small team", auth: "alice@example.com / seeded"}

# Parts of the product, for working through a large product a piece at a time.
areas:
  - {id: A1, name: "Accounts (sign up, log in, log out, password reset, settings)", status: mapped}
  - {id: A2, name: "Projects and tasks (dashboard, projects, project page, My Tasks)", status: mapped}
  - {id: A3, name: "Team (invites)", status: mapped}
#  - {id: A1, name: "Accounts", status: mapped}     # pending | mapped

# Everything a user can touch.
