# User-flow registry. Single source of truth for what a user can do with this
# product and whether it has been shown to work. Check it with:
#   python3 .userflow/bin/uf-check.py --stage discover|flows|test|evaluate
# (no --stage runs every check). Paths in this file are relative to the
# project root.
# Written by the evaluator with userflow-tests/.results/build_registry.py.
version: 1
product:
  name: Helpline
  purpose: Helpline is a shared support inbox for a small company. Customers send in problems (through a contact form without an account, or as tickets in a small
    portal) and follow the conversation; agents answer tickets from a shared inbox, add internal notes, change status, priority and assignment, and use canned replies
    and bulk actions; admins also invite and deactivate teammates, change settings, manage canned replies and export all tickets as CSV; an AI assistant can work
    the same inbox for one agent through an MCP server. A background worker sends email (shown on a development page instead of really sent) and closes pending tickets
    that have had no activity for a set number of days.
  intent_sources:
  - PRD.md
  - README.md
  - the product's own UI text and email text
run:
  install: 'none needed for the product (README: ''No packages to install''). Test tooling: npm i -D @playwright/test @modelcontextprotocol/sdk'
  boot: 'PORT=4290 npm start   # runs dev.js: web (server.js) + worker (worker.js). README default port 4280 was taken on this machine'
  seed: PORT=4290 npm run seed
  reset: 'PORT=4290 npm run reset   # same as seed; safe while the app is up. Every flow test runs it first'
  stop: stop the process started by boot (SIGTERM to dev.js stops web and worker)
  base_url: http://localhost:4290
  test_command: PORT=4290 npx playwright test -c userflow-tests/playwright.config.js
  services:
  - name: web
    check: GET /health -> 200 {"ok":true}; entry page / loads in Chrome
    logs: userflow-tests/.results/logs/server.log
  - name: worker
    check: process `node worker.js` is up; log line 'Helpline worker running'; queued mail gets sent_at within ~2 s
    logs: userflow-tests/.results/logs/server.log
  - name: database
    check: SQLite file helpline.db opened read-only with node:sqlite; seed rows present (5 users, 32 tickets)
    logs: none
  - name: mcp
    check: HELPLINE_TOKEN=<agent token> PORT=4290 npm run mcp; official MCP client connects over stdio and lists tools
    logs: stderr of the mcp process
  stubs: []
personas:
- id: P1
  name: Visitor
  goal: Get help or get an account without having one yet
  auth: none (logged out)
- id: P2
  name: Customer
  goal: Send problems in and follow them
  auth: dana@customer.test or eli@customer.test / helpline123 (seeded), or sign up
- id: P3
  name: Agent
  goal: Answer tickets from the shared inbox
  auth: alice@helpline.test or bob@helpline.test / helpline123 (seeded)
- id: P4
  name: Admin
  goal: Run the team and the settings (and work tickets like an agent)
  auth: mira@helpline.test / helpline123 (seeded)
- id: P5
  name: AI assistant
  goal: Work the inbox for one agent through the MCP server
  auth: 'HELPLINE_TOKEN = that agent''s API token (API token page; seeded alice: hl_agent_alice_8e3b6a1d0c)'
