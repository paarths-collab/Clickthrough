# User-flow tests on every pull request.
#
# Copy to .github/workflows/clickthrough.yml once clickthrough-tests/stack/ exists
# (see the ct-env skill), then adjust the "Set up the toolchain" step for
# this project's language. It starts the disposable test stack, runs every
# flow test, and keeps the evidence as a build artifact.
name: user flows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Set up the toolchain: replace with what this project needs, e.g.
      # actions/setup-node, actions/setup-python, dtolnay/rust-toolchain.
      - name: Set up the toolchain
        run: echo "Add the project's toolchain setup here"

      - name: Install
        run: echo "Add the project's install command here (npm ci, pip install -r ..., cargo build)"

      - name: Start the test stack
        run: bash clickthrough-tests/stack/up && bash clickthrough-tests/stack/seed

      - name: Run the flow tests
        env:
          CT_EVIDENCE_DIR: ${{ github.workspace }}/clickthrough-evidence
        run: |
          # The command recorded in .clickthrough/flows.yaml under run.test_command.
          python3 - <<'PY' > /tmp/ct-test-command
          import yaml
          print(yaml.safe_load(open(".clickthrough/flows.yaml"))["run"]["test_command"])
          PY
          bash -c "$(cat /tmp/ct-test-command)"

      - name: Stop the test stack
        if: always()
        run: bash clickthrough-tests/stack/down || true

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickthrough-evidence
          path: clickthrough-evidence
          if-no-files-found: ignore
