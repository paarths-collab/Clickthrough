<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>New ticket - Helpline</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside id="sidebar"></aside>
<main>
  <h1>New ticket</h1>
  <form id="form">
    <label for="subject">Subject</label>
    <input type="text" id="subject">
    <label for="description">What is the problem?</label>
    <textarea id="description"></textarea>
    <label for="priority">How urgent is it?</label>
    <select id="priority">
      <option value="low">Low</option>
      <option value="normal" selected>Normal</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
    <button type="submit">Send ticket</button>
  </form>
  <p id="msg" class="msg"></p>
</main>
<script src="/app.js"></script>
<script>
(async () => {
  await boot(['customer']);
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await api('POST', '/api/tickets', {
      subject: $('subject').value, description: $('description').value, priority: $('priority').value,
    });
    if (!res.ok) return say('msg', res.data.error || 'Could not send the ticket.', 'error');
    location.href = `/portal-ticket.html?id=${res.data.id}`;
  });
})();
</script>
</body>
</html>
