<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Forgot password - Helpline</title><link rel="stylesheet" href="/style.css"></head>
<body class="plain">
<main>
  <h1>Forgot your password?</h1>
  <p>Enter your email address and we will send you a link to choose a new one.</p>
  <form id="form">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <button type="submit">Send reset link</button>
  </form>
  <p id="msg" class="msg"></p>
  <p><a href="/">Back to log in</a></p>
</main>
<script src="/app.js"></script>
<script>
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  await api('POST', '/api/forgot', { email: $('email').value });
  say('msg', 'If that address has an account, a reset link is on its way.', 'ok');
});
</script>
</body>
</html>
