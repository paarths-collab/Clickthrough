<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Choose a new password - Helpline</title><link rel="stylesheet" href="/style.css"></head>
<body class="plain">
<main>
  <h1>Choose a new password</h1>
  <form id="form">
    <label for="password">New password</label>
    <input type="password" id="password" required>
    <button type="submit">Save new password</button>
  </form>
  <p id="msg" class="msg"></p>
  <p><a href="/">Back to log in</a></p>
</main>
<script src="/app.js"></script>
<script>
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await api('POST', '/api/reset', { token: param('t'), password: $('password').value });
  if (!res.ok) return say('msg', res.data.error || 'Could not change the password.', 'error');
  say('msg', 'Password changed. You can log in with it now.', 'ok');
});
</script>
</body>
</html>
