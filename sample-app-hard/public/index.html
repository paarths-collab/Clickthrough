<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Log in - Helpline</title><link rel="stylesheet" href="/style.css"></head>
<body class="plain">
<main>
  <h1>Log in to Helpline</h1>
  <form id="form">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit">Log in</button>
  </form>
  <p id="msg" class="msg"></p>
  <p><a href="/forgot.html">Forgot password?</a></p>
  <p><a href="/signup.html">Create a customer account</a></p>
  <p><a href="/contact.html">Contact us without an account</a></p>
</main>
<script src="/app.js"></script>
<script>
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await api('POST', '/api/login', { email: $('email').value, password: $('password').value });
  if (!res.ok) return say('msg', res.data.error || 'Could not log in.', 'error');
  location.href = homeFor(res.data);
});
</script>
</body>
</html>
