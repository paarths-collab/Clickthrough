<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create account - Helpline</title><link rel="stylesheet" href="/style.css"></head>
<body class="plain">
<main>
  <h1>Create a customer account</h1>
  <form id="form">
    <label for="name">Your name</label>
    <input type="text" id="name">
    <label for="email">Email</label>
    <input type="text" id="email">
    <label for="password">Password</label>
    <input type="password" id="password">
    <button type="submit">Create account</button>
  </form>
  <p id="msg" class="msg"></p>
  <p><a href="/">Back to log in</a></p>
</main>
<script src="/app.js"></script>
<script>
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await api('POST', '/api/signup', {
    name: $('name').value, email: $('email').value, password: $('password').value,
  });
  if (!res.ok) return say('msg', res.data.error || 'Could not create the account.', 'error');
  location.href = '/portal.html';
});
</script>
</body>
</html>
