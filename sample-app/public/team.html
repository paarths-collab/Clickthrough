<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tasklet - Team</title>
<link rel="stylesheet" href="/style.css"></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main>
  <h2>Team</h2>
  <div class="card">
    <form id="invite">
      <input type="email" name="email" placeholder="teammate@example.com" required>
      <button type="submit">Send invite</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
  <div class="card"><h3>Invited</h3><ul class="list" id="invites"></ul></div>
</main></div>
<script src="/app.js"></script>
<script>
async function load() {
  const { invites } = await (await api('GET', '/api/team')).json();
  document.getElementById('invites').innerHTML = invites.length
    ? invites.map((i) => `<li>${esc(i.email)}</li>`).join('')
    : '<li class="muted">Nobody invited yet.</li>';
}
(async () => {
  await boot();
  await load();
  document.getElementById('invite').onsubmit = async (e) => {
    e.preventDefault();
    const email = new FormData(e.target).get('email');
    const res = await api('POST', '/api/team/invite', { email });
    const msg = document.getElementById('msg');
    if (res.ok) { msg.className = 'msg ok'; msg.textContent = 'Invite sent.'; e.target.reset(); await load(); }
    else { msg.className = 'msg err'; msg.textContent = (await res.json()).error; }
  };
})();
</script>
</body></html>
