<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tasklet - Log in</title>
<link rel="stylesheet" href="/style.css"></head>
<body>
<div class="auth card">
  <h2>Log in to Tasklet</h2>
  <form id="login">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>
  <div id="msg" class="msg err"></div>
  <p class="muted"><a href="#" id="forgot">Forgot password?</a></p>
  <p class="muted">New here? <a href="/signup.html">Create an account</a></p>
</div>
<script>
document.getElementById('login').onsubmit = async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const res = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: form.get('email'), password: form.get('password') }),
  });
  if (res.ok) location.href = '/dashboard.html';
  else document.getElementById('msg').textContent = (await res.json()).error;
};
</script>
</body></html>
