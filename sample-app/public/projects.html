<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tasklet - Projects</title>
<link rel="stylesheet" href="/style.css"></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main>
  <h2>Projects</h2>
  <div class="card">
    <form id="new-project">
      <input type="text" name="name" placeholder="Project name">
      <button type="submit">Create project</button>
    </form>
    <div id="msg" class="msg err"></div>
  </div>
  <div class="card"><ul class="list" id="projects"></ul></div>
</main></div>
<script src="/app.js"></script>
<script>
async function load() {
  const { projects } = await (await api('GET', '/api/projects')).json();
  document.getElementById('projects').innerHTML = projects.length
    ? projects.map((p) => `<li><a class="grow" href="/project.html?id=${p.id}">${esc(p.name)}</a>
        <span class="muted">${p.open_tasks} open</span></li>`).join('')
    : '<li class="muted">No projects yet.</li>';
}
(async () => {
  await boot();
  await load();
  document.getElementById('new-project').onsubmit = async (e) => {
    e.preventDefault();
    const name = new FormData(e.target).get('name');
    const res = await api('POST', '/api/projects', { name });
    if (res.ok) { e.target.reset(); await load(); }
  };
})();
</script>
</body></html>
