<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tasklet - Settings</title>
<link rel="stylesheet" href="/style.css"></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main>
  <h2>Settings</h2>
  <div class="card">
    <form id="settings">
      <label>Display name<br><input type="text" name="name" id="name"></label>
      <button type="submit">Save</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
</main></div>
<script src="/app.js"></script>
<script>
(async () => {
  const user = await boot();
  document.getElementById('name').value = user.name;
  document.getElementById('settings').onsubmit = async (e) => {
    e.preventDefault();
    const res = await api('PUT', '/api/settings', { name: document.getElementById('name').value });
    const data = await res.json();
    const msg = document.getElementById('msg');
    if (res.ok) {
      msg.className = 'msg ok'; msg.textContent = 'Saved!';
      document.getElementById('who-name').textContent = data.name;
    } else { msg.className = 'msg err'; msg.textContent = data.error; }
  };
})();
</script>
</body></html>
